name: Validate installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./Install-HermesCustom.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Verify defaults and official installer pin
        shell: pwsh
        run: |
          $script = Get-Content ./Install-HermesCustom.ps1 -Raw
          $required = @(
            'Fermoders/hermes-agent',
            'https://hermes-agent.nousresearch.com/install.ps1',
            'IncludeDesktop',
            'hermes doctor'
          )
          foreach ($needle in $required) {
            if (-not $script.Contains($needle)) {
              throw "Installer is missing required marker: $needle"
            }
          }
      - name: Verify official invocation and failure propagation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .work | Out-Null
          Invoke-WebRequest https://hermes-agent.nousresearch.com/install.ps1 -OutFile .work/official-install.ps1
          ./tests/Installer.Invocation.Tests.ps1
      - name: Verify bounded fetch race recovery
        shell: powershell
        run: ./tests/Installer.FetchRetry.Tests.ps1
      - name: Verify fetch race recovery in PowerShell 7
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/Installer.FetchRetry.Tests.ps1
          if (-not $PSNativeCommandUseErrorActionPreference) { throw 'Caller native error preference was changed' }
      - name: Verify dirty checkout preservation
        shell: pwsh
        run: |
          ./tests/Installer.ManagedCheckout.Tests.ps1
          ./tests/Installer.ManagedCheckout.Functional.Tests.ps1

  fork:
    runs-on: ubuntu-latest
    steps:
      - name: Verify custom fork branch
        run: |
          git clone --depth 1 --branch main https://github.com/Fermoders/hermes-agent.git fork
          git -C fork rev-parse HEAD
          for file in pm/lock.json pm/cli.py hermes_cli/source_completion.py scripts/desktop-update/runtime.ps1; do
            test -f "fork/$file" || { printf 'Fork missing required upstream contract: %s\n' "$file"; exit 1; }
          done
